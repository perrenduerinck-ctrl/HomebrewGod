<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Walking Speed Self Test</title>
  </head>
  <body data-test-status="running">
    <main>
      <label for="ccCustomSpeciesSpeed">
        Walking Speed
      </label>
      <input
        id="ccCustomSpeciesSpeed"
        type="number"
      >
      <label for="ccClimbSpeed">
        Climbing Speed
      </label>
      <input
        id="ccClimbSpeed"
        type="number"
        data-draft-path="combat.baseSpeed.climb"
      >
      <label for="ccSwimSpeed">
        Swimming Speed
      </label>
      <input
        id="ccSwimSpeed"
        type="number"
        data-draft-path="combat.baseSpeed.swim"
      >
      <label for="ccFlySpeed">
        Flying Speed
      </label>
      <input
        id="ccFlySpeed"
        type="number"
        data-draft-path="combat.baseSpeed.fly"
      >
      <label for="ccBurrowSpeed">
        Burrowing Speed
      </label>
      <input
        id="ccBurrowSpeed"
        type="number"
        data-draft-path="combat.baseSpeed.burrow"
      >
      <output id="walkingSpeedResult">
        RUNNING
      </output>
    </main>

    <script type="module">
      import {
        installWalkingSpeedInputGuard
      } from "../../characterCreator/walkingSpeed.js?v=custom-movement-speeds-20260731";

      const character = {
        combat: {
          speed: {
            walk:
              30000000000000000000,
            climb:
              30000000000000000000,
            swim:
              30000000000000000000,
            fly:
              30000000000000000000,
            burrow:
              30000000000000000000
          }
        }
      };

      installWalkingSpeedInputGuard({
        root: document,
        getCharacter: () => {
          return character;
        }
      });

      window.__WALKING_SPEED_TEST__ = {
        character,
        ping() {
          return "responsive";
        }
      };

      document.body.dataset
        .testStatus = "pass";
      document.getElementById(
        "walkingSpeedResult"
      ).textContent = "PASS";
    </script>
  </body>
</html>
