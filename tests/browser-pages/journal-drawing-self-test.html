<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal and drawing integration fixture</title>
  <link rel="stylesheet" href="../../journal/journal.css">
  <link rel="stylesheet" href="../../battleMap/drawingTools.css">
  <style>
    body { margin: 0; background: #080b17; color: #eef1ff; font: 14px system-ui; }
    button, input, select { font: inherit; }
    #surface { position: relative; width: 900px; min-height: 520px; }
    #map { position: relative; width: 800px; height: 400px; margin: 60px 40px; background: #26304b; }
    #mapImage { display: block; position: relative; width: 640px; height: 320px; margin: 40px 80px; transform-origin: center center; pointer-events: none; }
    #token { position: absolute; z-index: 300; left: 370px; top: 300px; width: 60px; height: 60px; }
    #journal { width: min(850px, calc(100vw - 40px)); padding: 20px; }
  </style>
</head>
<body>
  <div id="quick"></div>
  <section id="surface"><div id="map"><img id="mapImage" alt="Rectangular test map"><button id="token" type="button">Token</button></div></section>
  <div id="journal"></div>
  <script type="module">
    import { createMapDrawingSystem } from "../../battleMap/drawingTools.js";
    import { createJournalSystem } from "../../journal/journal.js";

    const operations = [];
    const listeners = [];
    const documents = new Map();
    let writeGate = null;
    let nextWriteError = null;
    const pathOf = (...parts) => parts.map((part) => part?.path || String(part)).join("/");
    const collection = (...parts) => ({ path: pathOf(...parts) });
    const doc = (...parts) => ({ path: pathOf(...parts) });
    const query = (source, ...filters) => ({ path: source.path, filters });
    const where = (...parts) => ({ where: parts });
    const onSnapshot = (source, options, next, error) => {
      const record = { source, active: true, next, error };
      listeners.push(record);
      queueMicrotask(() => {
        if (record.active) next({ docs: [], metadata: { hasPendingWrites: false } });
      });
      return () => { record.active = false; };
    };
    const beforeWrite = async () => {
      if (writeGate) {
        const gate = writeGate;
        await gate.promise;
        if (writeGate === gate) writeGate = null;
      }
      if (nextWriteError) {
        const error = nextWriteError;
        nextWriteError = null;
        throw error;
      }
    };
    const mergeDocument = (path, payload, merge = false) => {
      documents.set(path, merge ? { ...(documents.get(path) || {}), ...payload } : { ...payload });
    };
    const setDoc = async (reference, payload, options) => {
      await beforeWrite();
      operations.push({ type: "set", path: reference.path, payload, options });
      mergeDocument(reference.path, payload, options?.merge === true);
    };
    const deleteDoc = async (reference) => {
      await beforeWrite();
      operations.push({ type: "delete", path: reference.path });
      documents.delete(reference.path);
    };
    const updateDoc = async (reference, payload) => {
      operations.push({ type: "update", path: reference.path, payload });
    };
    const writeBatch = () => {
      const entries = [];
      return {
        set(reference, payload) { entries.push({ type: "set", path: reference.path, payload }); },
        delete(reference) { entries.push({ type: "delete", path: reference.path }); },
        async commit() {
          await beforeWrite();
          operations.push({ type: "batch", entries });
          entries.forEach((entry) => {
            if (entry.type === "delete") documents.delete(entry.path);
            else mergeDocument(entry.path, entry.payload, false);
          });
        }
      };
    };
    const runTransaction = async (_db, callback) => {
      const entries = [];
      const transaction = {
        async get(reference) {
          const value = documents.get(reference.path);
          return {
            exists: () => value !== undefined,
            data: () => value ? { ...value } : undefined
          };
        },
        set(reference, payload, options) {
          entries.push({ type: "set", path: reference.path, payload, options });
        },
        delete(reference) {
          entries.push({ type: "delete", path: reference.path });
        }
      };
      const result = await callback(transaction);
      await beforeWrite();
      if (entries.some((entry) => entry.type === "delete")) {
        operations.push({ type: "batch", entries });
      } else {
        entries.forEach((entry) => operations.push({ ...entry }));
      }
      entries.forEach((entry) => {
        if (entry.type === "delete") documents.delete(entry.path);
        else mergeDocument(entry.path, entry.payload, entry.options?.merge === true);
      });
      return result;
    };
    const serverTimestamp = () => "SERVER_TIMESTAMP";
    const fakeDb = { path: "db" };
    let mapId = "map-one";
    let mapMode = "puzzle";
    let mapZoom = 1;
    let mapSpace = null;
    let tokenClicks = 0;
    document.querySelector("#token").addEventListener("click", () => { tokenClicks += 1; });

    const drawing = createMapDrawingSystem({
      document,
      surface: document.querySelector("#surface"),
      quickActions: document.querySelector("#quick"),
      mapViewer: document.querySelector("#map"),
      mapImage: document.querySelector("#mapImage"),
      puzzleBoard: document.querySelector("#map"),
      db: fakeDb,
      collection,
      doc,
      query,
      where,
      onSnapshot,
      setDoc,
      deleteDoc,
      updateDoc,
      writeBatch,
      serverTimestamp,
      requestConfirmation: async () => true,
      getMapContext: () => ({
        mapId,
        target: document.querySelector("#map"),
        mode: mapMode,
        zoom: mapZoom,
        space: mapSpace
      })
    });
    drawing.setContext({
      roomCode: "ROOM-1",
      userId: "dm-1",
      userName: "DM",
      isDm: true,
      playersEnabled: true
    });

    const journal = createJournalSystem({
      document,
      db: fakeDb,
      collection,
      doc,
      query,
      where,
      onSnapshot,
      setDoc,
      deleteDoc,
      runTransaction,
      writeBatch,
      serverTimestamp,
      requestConfirmation: async () => true
    });
    document.querySelector("#journal").append(journal.root);
    journal.setContext({
      roomCode: "ROOM-1",
      userId: "dm-1",
      userName: "DM",
      isDm: true
    });

    window.fixture = {
      drawing,
      journal,
      operations,
      listeners,
      delayNextWrite() {
        if (writeGate) return;
        let release;
        const promise = new Promise((resolve) => { release = resolve; });
        writeGate = { promise, release };
      },
      releaseWrite() { writeGate?.release(); },
      failNextWrite(message = "simulated save failure") {
        nextWriteError = new Error(message);
      },
      emitJournal(visibility, records) {
        const collectionName = visibility === "dm"
          ? "dmJournal"
          : visibility === "shared" ? "sharedJournal" : "personalJournal";
        const sourceSuffix = `/rooms/${journal.getState().roomCode}/${collectionName}`;
        const docs = records.map((record) => {
          const path = `db${sourceSuffix}/${record.id}`;
          documents.set(path, { ...record });
          return { id: record.id, data: () => ({ ...record }) };
        });
        listeners
          .filter((listener) => listener.active && listener.source.path.endsWith(sourceSuffix))
          .forEach((listener) => listener.next({ docs, metadata: { hasPendingWrites: false } }));
      },
      emitDrawings(layer, records) {
        const collectionName = layer === "dm" ? "dmDrawings" : "sharedDrawings";
        const sourceSuffix = `/rooms/${drawing.getState().roomCode}/${collectionName}`;
        const docs = records.map((record) => {
          const path = `db${sourceSuffix}/${record.id}`;
          documents.set(path, { ...record });
          return { id: record.id, data: () => ({ ...record }) };
        });
        listeners
          .filter((listener) => listener.active && listener.source.path.endsWith(sourceSuffix))
          .forEach((listener) => listener.next({ docs, metadata: { hasPendingWrites: false } }));
      },
      getTokenClicks: () => tokenClicks,
      setMapId(value) { mapId = value; drawing.syncContext(); },
      setMapContext({ id = mapId, mode = mapMode, zoom = mapZoom, space = mapSpace } = {}) {
        mapId = id; mapMode = mode; mapZoom = zoom; mapSpace = space;
        document.querySelector("#mapImage").style.transform = mode === "single" ? `scale(${zoom})` : "none";
        drawing.syncContext();
      }
    };
  </script>
</body>
</html>
