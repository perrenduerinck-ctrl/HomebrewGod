<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebrew God Character-Creator Self-Tests</title>
</head>
<body data-test-status="running">
  <h1>Character-Creator Rules Self-Tests</h1>
  <pre id="result" role="status">RUNNING</pre>

  <script>
    window.alert = () => {};
    window.confirm = () => false;
    window.addEventListener("error", (event) => {
      const output = document.getElementById("result");
      document.body.dataset.testStatus = "fail";
      output.textContent =
        `FAIL\n${event.error?.stack || event.message}` +
        `\n${event.filename || "unknown"}:${event.lineno || 0}:${event.colno || 0}`;
    });
    window.addEventListener("unhandledrejection", (event) => {
      const output = document.getElementById("result");
      document.body.dataset.testStatus = "fail";
      output.textContent = `FAIL\n${event.reason?.stack || event.reason}`;
    });
  </script>
  <script type="importmap">
    {
      "imports": {
        "../../characterCreator/index.js": "../../characterCreator/index.js?v=priority10-20260822",
        "../../characterCreator/walkingSpeed.js?v=creator-fix-pass-20260730": "../../characterCreator/walkingSpeed.js?v=custom-movement-speeds-20260731",
        "../../characterCreator/customClassTools.js?v=creator-fix-pass-20260730": "../../characterCreator/customClassTools.js?v=custom-movement-speeds-20260731",
        "../../shared/securityPersistence.js": "../../shared/securityPersistence.js?v=priority10-20260822",
        "../../characterSheet/index.js": "../../characterSheet/index.js?v=priority10-20260822",
        "../../data/defaultClasses.js": "../../data/defaultClasses.js?v=priority10-20260822",
        "../../data/defaultClassFeatureCatalog.js": "../../data/defaultClassFeatureCatalog.js?v=priority10-20260822",
        "../../data/defaultClassFeatureRules.js": "../../data/defaultClassFeatureRules.js?v=priority10-20260822",
        "../../data/defaultSubclassCatalog.js": "../../data/defaultSubclassCatalog.js?v=priority10-20260822",
        "../../data/defaultSubclassNames.js": "../../data/defaultSubclassNames.js?v=priority10-20260822",
        "../../data/defaultSubclasses.js": "../../data/defaultSubclasses.js?v=priority10-20260822",
        "../../data/defaultFeats.js": "../../data/defaultFeats.js?v=priority10-20260822",
        "../../data/defaultSpells.js": "../../data/defaultSpells.js?v=priority10-20260822",
        "../../data/ruleset2014.js": "../../data/ruleset2014.js?v=priority10-20260822",
        "../../characterCreator/catalogs.js": "../../characterCreator/catalogs.js?v=phase20-20260727",
        "../../characterCreator/classMechanics.js": "../../characterCreator/classMechanics.js?v=phase20-20260727",
        "../../characterCreator/classProgression.js": "../../characterCreator/classProgression.js?v=phase20-20260727",
        "../../characterCreator/featMechanics.js": "../../characterCreator/featMechanics.js?v=phase20-20260727",
        "../../characterCreator/inventoryEquipment.js": "../../characterCreator/inventoryEquipment.js?v=phase20-20260727",
        "../../characterCreator/multiclassing.js": "../../characterCreator/multiclassing.js?v=phase20-20260727",
        "../../characterCreator/normalization.js": "../../characterCreator/normalization.js?v=phase20-20260727",
        "../../characterCreator/persistence.js": "../../characterCreator/persistence.js?v=phase20-20260727",
        "../../characterCreator/rendering.js": "../../characterCreator/rendering.js?v=phase20-20260727",
        "../../characterCreator/rulesMath.js": "../../characterCreator/rulesMath.js?v=phase20-20260727",
        "../../characterCreator/selfTests.js": "../../characterCreator/selfTests.js?v=feat-removal-20260730",
        "../../characterCreator/sheetPresentation.js": "../../characterCreator/sheetPresentation.js?v=phase20-20260727",
        "../../characterCreator/speciesBackgrounds.js": "../../characterCreator/speciesBackgrounds.js?v=phase20-20260727",
        "../../characterCreator/spellcasting.js": "../../characterCreator/spellcasting.js?v=phase20-20260727",
        "../../characterCreator/subclassMechanics.js": "../../characterCreator/subclassMechanics.js?v=phase20-20260727"
      }
    }
  </script>
  <script type="module">
    import { createCharacterCreator } from "../../characterCreator/index.js";

    const output = document.getElementById("result");

    try {
      const creator = createCharacterCreator();
      const result = creator.runRulesSelfTests();
      window.__CHARACTER_CREATOR_SELF_TEST_RESULT__ =
        result;
      document.body.dataset.testStatus = result.passed ? "pass" : "fail";
      output.textContent = JSON.stringify(result, null, 2);

      if (!result.passed) {
        console.error(
          `${result.failed.length} of ${result.total} self-tests failed`,
          result.failed
        );
      }
    } catch (error) {
      document.body.dataset.testStatus = "fail";
      output.textContent =
        output.textContent === "RUNNING"
          ? `FAIL\n${error?.stack || error}`
          : `${output.textContent}\n\nFAIL\n${error?.stack || error}`;
      throw error;
    }
  </script>
</body>
</html>
