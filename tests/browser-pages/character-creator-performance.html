<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Character Creator Performance Harness</title>
    <link
      rel="stylesheet"
      href="../../assets/styles/app.css"
    >
  </head>
  <body data-test-status="running">
    <section
      id="characterCreatorScreen"
      class="screen"
    >
      <div class="creatorTopBar">
        <p class="small"></p>
      </div>
      <div class="creatorActionBar"></div>
      <div class="creatorFullGrid"></div>
      <p
        id="characterCreatorStatus"
        role="status"
      ></p>
    </section>

    <script>
      window.alert = () => {};
      window.confirm = () => true;

      function reportFailure(error) {
        document.body.dataset.testStatus = "fail";
        document.getElementById(
          "characterCreatorStatus"
        ).textContent =
          error?.stack ||
          error?.message ||
          String(error);
      }

      window.addEventListener(
        "error",
        (event) => {
          reportFailure(
            event.error || event.message
          );
        }
      );
      window.addEventListener(
        "unhandledrejection",
        (event) => {
          reportFailure(event.reason);
        }
      );
    </script>

    <script type="module">
      import {
        createCharacterCreator
      } from "../../characterCreator/index.js?priority12-20260823";

      const creator =
        createCharacterCreator();

      creator.state.viewMode =
        "builder";
      creator.startNew();

      window.__CHARACTER_CREATOR_PERFORMANCE__ =
        creator;
      document.body.dataset.testStatus =
        "ready";
    </script>
  </body>
</html>
