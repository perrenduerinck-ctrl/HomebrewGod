<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    >
    <title>Character Field Limits Self-Test</title>
  </head>
  <body data-test-status="running">
    <main>
      <label for="testCharacterName">
        Character Name
      </label>
      <input
        id="testCharacterName"
        type="text"
        data-draft-path="identity.name"
      >

      <label for="testSearch">
        Search
      </label>
      <input
        id="testSearch"
        type="search"
      >

      <label for="testAppearance">
        Appearance
      </label>
      <textarea
        id="testAppearance"
        data-draft-path="identity.appearance"
      ></textarea>

      <label for="testBackstory">
        Backstory
      </label>
      <textarea
        id="testBackstory"
        data-draft-path="background.backstory"
      ></textarea>

      <label for="testSpellDescription">
        Spell Description
      </label>
      <textarea
        id="testSpellDescription"
        data-draft-path="magic.customSpells.0.description"
      ></textarea>

      <section
        id="customClassMovementFields"
        aria-label="Custom Class Movement"
      ></section>
    </main>

    <script type="module">
      import {
        applyCharacterCreatorFieldLimits,
        installCharacterCreatorTextInputGuard
      } from "../../characterCreator/fieldLimits.js?v=creator-fix-pass-20260730";
      import {
        installWalkingSpeedInputGuard
      } from "../../characterCreator/walkingSpeed.js?v=custom-movement-speeds-20260731";
      import {
        renderCustomClassMovementFields
      } from "../../characterCreator/customClassTools.js?v=custom-movement-speeds-20260731";

      document.getElementById(
        "customClassMovementFields"
      ).innerHTML =
        renderCustomClassMovementFields({
          template: {},
          wizardField(
            label,
            id,
            value,
            options
          ) {
            return `
              <label for="${id}">
                ${label}
              </label>
              <input
                id="${id}"
                type="${options.type}"
                value="${value}"
                ${options.extra}
              >
            `;
          }
        });

      installCharacterCreatorTextInputGuard({
        root: document
      });
      applyCharacterCreatorFieldLimits(
        document
      );
      installWalkingSpeedInputGuard({
        root: document
      });

      document.body.dataset
        .testStatus = "pass";
    </script>
  </body>
</html>
