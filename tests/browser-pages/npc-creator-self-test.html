<!doctype html><html><head><meta charset="utf-8"><title>NPC Creator Test</title><link rel="stylesheet" href="../../assets/styles/app.css"><link rel="stylesheet" href="../../npcs/npcCreator.css"></head><body>
<main id="screen"></main>
<script type="module">
  import { createNpcCreator } from "../../npcs/npcCreator.js";
  import { normalizeNpc } from "../../npcs/npcModel.js";
  const records = new Map(); let next = 0;
  const persistence = {
    async save(raw) { const npc = normalizeNpc({ ...raw, id: raw.id || `npc-${++next}`, updatedAtMillis: Date.now() }); records.set(npc.id, npc); return npc; },
    async load(id) { return records.get(id); },
    async list() { return [...records.values()]; },
    async remove(id) { records.delete(id); }
  };
  window.__published = null; window.__token = null; window.__browse = null;
  window.creator = createNpcCreator({
    screen: document.getElementById("screen"), persistence,
    getUserId: () => "user-1", getCurrentRoomCode: () => "SEA-1", getCurrentRoomName: () => "Sea of Glass",
    onPublishToWorkshop: (request) => { window.__published = request; },
    onBrowseLibrary: (request) => { window.__browse = request; },
    onCreateToken: async (npc) => { window.__token = npc; return { message: "NPC token created." }; }
  });
  window.npcRecords = () => [...records.values()];
</script></body></html>
