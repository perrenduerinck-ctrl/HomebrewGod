<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Multi-floor integration fixture</title>
  <link rel="stylesheet" href="../../battleMap/floorSystem.css">
  <link rel="stylesheet" href="../../battleMap/floorConnectionMarkers.css">
  <style>
    body { margin: 0; padding: 16px; background: #080b17; color: #eef1ff; font: 14px system-ui; }
    button, select, input { font: inherit; }
    .hidden { display: none !important; }
    #floorSelectorPanel { max-width: 900px; }
    .map-fixture { position: relative; min-height: 620px; border-radius: 16px; background: radial-gradient(circle, #202a48, #070a12 68%); }
  </style>
</head>
<body>
  <section id="floorSelectorPanel" class="hg-floor-panel">
    <div class="hg-floor-compact" data-floor-compact>
      <button data-floor-action="previous-floor" aria-label="Previous floor">↑</button>
      <label class="hg-floor-jump-label"><select data-floor-jump aria-label="Current floor"></select></label>
      <button data-floor-action="next-floor" aria-label="Next floor">↓</button>
      <button data-floor-manage-toggle aria-expanded="false" aria-controls="floorManagementDrawer" aria-label="Manage floors">⚙</button>
      <strong data-floor-active hidden></strong>
    </div>
    <button class="hg-floor-drawer-backdrop" data-floor-manage-close tabindex="-1" aria-label="Close floor management"></button>
    <aside id="floorManagementDrawer" class="hg-floor-drawer" data-floor-drawer aria-hidden="true">
      <header class="hg-floor-drawer-header"><h2>Manage Floors</h2><button data-floor-manage-close aria-label="Close floor management">×</button></header>
      <div class="hg-floor-panel-body">
      <div class="hg-floor-toolbar">
        <label><span>Location</span><select data-floor-location></select></label>
        <label class="hg-floor-follow-control"><input data-floor-follow type="checkbox"><span>Follow DM</span></label>
        <div data-floor-dm-controls class="hg-floor-dm-controls">
          <button data-floor-action="create-location">New Location</button>
          <button data-floor-action="rename-location">Rename</button>
          <button data-floor-action="delete-location">Delete Location</button>
          <button data-floor-action="add-floor">Add Floor</button>
          <button data-floor-action="add-connection">Add Connection</button>
          <button data-floor-action="broadcast">Broadcast Floor</button>
        </div>
      </div>
      <div data-floor-list class="hg-floor-list"></div>
      <div data-floor-connections></div>
      <p data-floor-status></p>
      </div>
    </aside>
  </section>
  <main class="map-fixture" aria-label="Map fixture"><div class="hg-token" data-token-id="hero" style="position:absolute;left:20%;top:30%"></div></main>
  <script type="module">
    import { createFloorSystem } from "../../battleMap/floorSystem.js";
    import { createFloorConnectionMarkers } from "../../battleMap/floorConnectionMarkers.js";

    const fixtureParams = new URLSearchParams(location.search);
    const fixtureIsDm = fixtureParams.get("role") !== "player";
    const fixtureIsLegacy = fixtureParams.get("legacy") === "1";
    const broadcasts = [];
    const transfers = [];
    const scene = { id: "house", roomCode: "ROOM-1", name: "Abandoned House", description: "", schemaVersion: 1 };
    const floors = [
      { id: "basement", sceneId: "house", roomCode: "ROOM-1", name: "Basement", baseElevation: -10, order: 0, map: { id: "map-basement", name: "Basement", url: "https://example.test/basement.webp" } },
      { id: "ground", sceneId: "house", roomCode: "ROOM-1", name: "Ground Floor", baseElevation: 0, order: 0, map: { id: "map-ground", name: "Ground", url: "https://example.test/ground.webp" } },
      { id: "second", sceneId: "house", roomCode: "ROOM-1", name: "Second Floor", baseElevation: 15, order: 1, map: { id: "map-second", name: "Second", url: "https://example.test/second.webp" } }
    ];
    const connections = [{
      id: "stairs", sceneId: "house", roomCode: "ROOM-1", name: "Main Stairs", type: "stairs",
      source: { floorId: "ground", x: 20, y: 30 }, destination: { floorId: "second", x: 80, y: 70 },
      bidirectional: true, allowPlayers: true, movementCost: 10
    }];
    const defer = (callback, value) => {
      queueMicrotask(() => callback(value));
      return () => {};
    };
    const floorSaves = [];
    const connectionSaves = [];
    const persistence = {
      listenScenes(roomCode, callback) { return defer(callback, fixtureIsLegacy ? [] : [scene]); },
      listenFloors(roomCode, sceneId, callback) { return defer(callback, floors); },
      listenConnections(roomCode, sceneId, callback) { return defer(callback, connections); },
      saveFloor(roomCode, sceneId, floorId, value) { floorSaves.push({ floorId, value }); return Promise.resolve(value); },
      saveConnection(roomCode, sceneId, connectionId, value) { connectionSaves.push({ connectionId, value }); return Promise.resolve(value); },
      deleteConnection() { return Promise.resolve(); }
    };
    const token = { id: "hero", name: "Hero", ownerUid: "dm-1", sceneId: "house", floorId: "ground", x: 20, y: 30, elevation: 0 };
    const floorSystem = createFloorSystem({
      root: document.querySelector("#floorSelectorPanel"),
      persistence,
      storage: sessionStorage,
      getTokens: () => [token],
      getSelectedToken: () => token,
      canControlToken: () => true,
      getInitiativeState: () => ({ combatActive: false }),
      getConnectionDistanceFeet: () => 0,
      requestConfirmation: async () => true,
      onBroadcast: async (value) => broadcasts.push(value),
      onUseConnection: async (value) => transfers.push({ floorId: value.floor.id, connectionId: value.connection.id })
    });
    floorSystem.setContext({
      roomCode: "ROOM-1",
      userId: fixtureIsDm ? "dm-1" : "player-1",
      isDm: fixtureIsDm,
      room: fixtureIsLegacy
        ? { activeSceneId: "", activeFloorId: "" }
        : { activeSceneId: "house", activeFloorId: "ground" }
    });
    await new Promise((resolve) => setTimeout(resolve, 0));
    const selectionSubscribers = new Set();
    const tokenSystem = {
      getSelectedToken: () => token,
      subscribeSelection(callback) { selectionSubscribers.add(callback); callback(token); return () => selectionSubscribers.delete(callback); }
    };
    const markerSystem = createFloorConnectionMarkers({
      floorSystem,
      tokenSystem,
      getContainer: () => document.querySelector(".map-fixture"),
      getContext: () => ({ isDm: fixtureIsDm, canControl: true, combatActive: false, pixelsPerSquare: 64, feetPerSquare: 5 }),
      onUse: ({ connection }) => floorSystem.useConnection(connection, { token }),
      onEdit: ({ connection }) => floorSystem.editConnection(connection)
    });
    markerSystem.setScreen("battle");
    window.fixture = { floorSystem, markerSystem, broadcasts, transfers, floorSaves, connectionSaves };
    document.body.dataset.ready = "true";
  </script>
</body>
</html>
