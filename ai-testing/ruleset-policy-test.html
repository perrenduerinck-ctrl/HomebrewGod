<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Homebrew God Ruleset Policy Tests</title>
</head>
<body data-test-status="running">
  <h1>Ruleset Policy Tests</h1>
  <pre id="result" role="status">RUNNING</pre>

  <script type="importmap">
    {
      "imports": {
        "../defaultClasses.js": "../defaultClasses.js?v=phase20-20260727",
        "../defaultClassFeatureCatalog.js": "../defaultClassFeatureCatalog.js?v=phase20-20260727",
        "../defaultClassFeatureRules.js": "../defaultClassFeatureRules.js?v=phase20-20260727",
        "../defaultSubclassCatalog.js": "../defaultSubclassCatalog.js?v=phase20-20260727",
        "../defaultSubclassNames.js": "../defaultSubclassNames.js?v=phase20-20260727",
        "../defaultSubclasses.js": "../defaultSubclasses.js?v=phase20-20260727",
        "../defaultFeats.js": "../defaultFeats.js?v=phase20-20260727",
        "../defaultSpells.js": "../defaultSpells.js?v=phase20-20260727",
        "../ruleset2014.js": "../ruleset2014.js?v=phase20-20260727"
      }
    }
  </script>
  <script type="module">
    import { DEFAULT_CLASSES } from "../defaultClasses.js";
    import { DEFAULT_SUBCLASSES } from "../defaultSubclasses.js";
    import {
      DEFAULT_FEATS,
      validateFeatPrerequisiteDefinitions
    } from "../defaultFeats.js";
    import {
      DEFAULT_SPELLS,
      validateDefaultSpellCatalog
    } from "../defaultSpells.js";
    import {
      ACTIVE_RULESET,
      isActiveRulesetEntry
    } from "../ruleset2014.js";

    const groups = {
      classes: Object.values(DEFAULT_CLASSES),
      subclasses: DEFAULT_SUBCLASSES,
      feats: DEFAULT_FEATS,
      spells: DEFAULT_SPELLS
    };
    const failures = [];

    Object.entries(groups).forEach(([groupName, entries]) => {
      entries.forEach((entry) => {
        if (entry.rulesetId !== ACTIVE_RULESET.id) {
          failures.push(`${groupName}:${entry.id} has no active ruleset ID`);
        }
        if (entry.rulesEdition !== ACTIVE_RULESET.edition) {
          failures.push(`${groupName}:${entry.id} has no 2014 edition label`);
        }
        if (!entry.sourceLabel || !entry.sourceType) {
          failures.push(`${groupName}:${entry.id} has no catalog source label`);
        }
      });
    });

    if (isActiveRulesetEntry({ rulesetId: "dnd5e-2024" })) {
      failures.push("2024 content was accepted by the 2014 rules mode");
    }

    failures.push(
      ...validateFeatPrerequisiteDefinitions(
        DEFAULT_FEATS
      )
    );

    const elementalAdept = DEFAULT_FEATS.find(
      (feat) => feat.id === "elemental-adept"
    );
    const magicInitiate = DEFAULT_FEATS.find(
      (feat) => feat.id === "magic-initiate"
    );

    if (
      elementalAdept?.repeatable !== true ||
      elementalAdept?.repeatByChoice !== true ||
      ACTIVE_RULESET.featRepeatability.elementalAdept !==
        "repeat-by-damage-type"
    ) {
      failures.push(
        "Elemental Adept does not use the 2014 repeat-by-damage-type policy"
      );
    }

    if (
      magicInitiate?.repeatable !== false ||
      magicInitiate?.repeatByChoice !== false ||
      ACTIVE_RULESET.featRepeatability.magicInitiate !==
        "single-selection"
    ) {
      failures.push(
        "Magic Initiate does not use the 2014 single-selection policy"
      );
    }

    if (
      ACTIVE_RULESET
        .speciesBackgroundCatalog
        ?.builtinSpecies !==
        "core-nine" ||
      ACTIVE_RULESET
        .speciesBackgroundCatalog
        ?.builtinBackgrounds !==
        "legacy-thirteen" ||
      ACTIVE_RULESET
        .speciesBackgroundCatalog
        ?.additionalPublishedContent !==
        "not-bundled" ||
      ACTIVE_RULESET
        .speciesBackgroundCatalog
        ?.extensionPolicy !==
        "custom-or-room-content-with-source-labels"
    ) {
      failures.push(
        "Species and background catalog policy is incomplete"
      );
    }

    const spellCatalogAudit =
      validateDefaultSpellCatalog(
        DEFAULT_SPELLS,
        {
          feats: DEFAULT_FEATS,
          subclasses:
            DEFAULT_SUBCLASSES
        }
      );

    failures.push(
      ...spellCatalogAudit.errors
    );

    if (
      ACTIVE_RULESET
        .spellCatalog
        ?.srdSpells !== 319 ||
      ACTIVE_RULESET
        .spellCatalog
        ?.additionalCantrips !== 21 ||
      ACTIVE_RULESET
        .spellCatalog
        ?.totalSpells !== 340 ||
      ACTIVE_RULESET
        .spellCatalog
        ?.additionalLeveledSpells !==
        "inline-subclass-fallbacks-only"
    ) {
      failures.push(
        "Spell catalog policy is incomplete"
      );
    }

    const result = {
      passed: failures.length === 0,
      ruleset: ACTIVE_RULESET,
      counts: Object.fromEntries(
        Object.entries(groups).map(([key, entries]) => [key, entries.length])
      ),
      spellCatalog:
        spellCatalogAudit.counts,
      failures
    };

    document.body.dataset.testStatus = result.passed ? "pass" : "fail";
    document.getElementById("result").textContent =
      JSON.stringify(result, null, 2);

    if (!result.passed) {
      throw new Error(failures.join(" | "));
    }
  </script>
</body>
</html>
