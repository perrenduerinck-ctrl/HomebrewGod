    function adjustResource(kind, resourceId, delta) {
      const resources =
        kind === "class"
          ? character.classMechanics.resources
          : character.featMechanics.resources;
      const resource = resources.find((entry) => {
        return entry.id === resourceId;
      });

      if (!resource) {
        return false;
      }

      resource.currentUses = Math.max(
        0,
        Math.min(
          resource.maximumUses,
          resource.currentUses + delta
        )
      );
      return character;
    }

    const view = createCharacterSheetView({
      root: "#sheetRoot",
      getCharacter: () => character,
      getSheetContext: () => ({
        characterId: character.id,
        dirty: false,
        returnLabel: "Back to Library"
      }),
      setStatus: (message) => {
        document.body.dataset.lastStatus =
          String(message || "");
      },
      onGameplayAction: async (action) => {
        const result =
          applyGameplayAction(
            character,
            action
          );
        document.body.dataset.lastMutation =
          result.message;
        return character;
      },
      onAdjustClassResource: (
        resourceId,
        delta
      ) => {
        return adjustResource(
          "class",
          resourceId,
          delta
        );
      },
      onAdjustFeatResource: (
        resourceId,
        delta
      ) => {
        const featSpell =
          character.featMechanics
            .spellcasting
            .find((entry) => {
              return entry.id ===
                resourceId;
            });

        if (featSpell) {
          featSpell.currentUses =
            Math.max(
              0,
              Math.min(
                featSpell.maximumUses,
                featSpell.currentUses +
                  delta
              )
            );
          return character;
        }

        return adjustResource(
          "feat",
          resourceId,
          delta
        );
      },
      onAdjustHitDie: (
        hitDieId,
        delta
      ) => {
        character.combat
          .hitDiceUsage[hitDieId] =
            Math.max(
              0,
              (character.combat
                .hitDiceUsage[hitDieId] || 0) +
              delta
            );
        return character;
      },
      onAdjustSpellSlot: (
        kind,
        level,
        delta
      ) => {
        if (kind === "normal") {
          const maximum =
            character.magic.slots[level] || 0;
          character.magic
            .slotUsage.normal[level] =
              Math.max(
                0,
                Math.min(
                  maximum,
                  (character.magic
                    .slotUsage.normal[level] || 0) +
                  delta
                )
              );
        }
        return character;
      },
      onRest: (restType) => {
        if (restType === "longRest") {
          character.combat.currentHp =
            character.combat.maxHp;
          character.combat.temporaryHp = 0;
          character.magic.slotUsage.normal = {
            1: 0,
            2: 0,
            3: 0
          };
        }
        return character;
      },
      onExportJson: () => true,
      onPrint: () => true,
      onClose: () => true
    });

    if (
      new URLSearchParams(
        window.location.search
      ).get("fixture") ===
      "non-spellcaster"
    ) {
      character.id =
        "non-spellcaster-fixture";
      character.identity.name =
        "Brann Stone";
      character.classProgression = {
        totalLevel: 7,
        classes: [

            entryId: "fighter-entry",
            classId: "fighter",
            className: "Fighter",
            level: 7,
            subclassName: "Champion"
          }
        ]
      };
      character.magic = {};
      character.featMechanics
        .spellcasting = [];
    }

    view.open(character);
    window.__PLAYABLE_SHEET_TEST__ = {
      character,
      view
    };
    document.body.dataset.testStatus = "pass";
