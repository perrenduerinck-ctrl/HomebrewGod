name: Phase 20 release readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax, data, fixtures, unit, and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static, data, fixture, and unit gates
        run: pnpm test
      - name: Run Firestore security rules tests
        run: pnpm run test:rules
      - name: Run spell concurrency regressions
        run: pnpm run test:spell-audit:emulator

  browser:
    name: Browser tests (shard ${{ matrix.index }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - index: 1
            shard: 1/2
          - index: 2
            shard: 2/2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser release shard
        run: pnpm run test:browser --shard=${{ matrix.shard }}
      - name: Upload browser report on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-browser-${{ matrix.index }}
          path: playwright-report/
          if-no-files-found: ignore

  movement-browser:
    name: Movement browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run movement browser tests
        run: pnpm run test:movement:browser
      - name: Upload movement report on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-movement
          path: playwright-report/
          if-no-files-found: ignore

  stage8-browser:
    name: Authenticated DM and player emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run authenticated emulator playtest
        run: pnpm run test:stage8:browser
      - name: Upload authenticated playtest report on failure or cancellation
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-stage8
          path: playwright-report/
          if-no-files-found: ignore

  spell-multiplayer:
    name: Spell casting with real DM and player clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:spell-audit:multiplayer

  deploy:
    name: Deploy tested GitHub Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - validate
      - browser
      - movement-browser
      - stage8-browser
      - spell-multiplayer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install release dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the checked Pages artifact
        run: pnpm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Install Chromium for deployed checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify the deployed site
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: pnpm run test:deployed
